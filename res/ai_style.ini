; AI 风格转换类型配置
; - 每个 [section] 一个风格；name=显示名，prompt=提示词，thumb=可选缩略图路径(不含 A: 前缀，缺省用默认图)
; - 不要写「原图」，原图由程序内置为第一项
; - 修改本文件后重启应用生效；测试时可放一份到 /mnt/data/param/ai_style.ini，进风格预览页即整体覆盖生效
; - prompt 尽量把画面质感/光影/材质描述清楚，效果比只写风格名好得多

[blind_box]
name   = 盲盒手办
prompt = 把画面主体做成潮流盲盒手办：圆润 Q 版比例、大头大眼、光滑的搪胶塑料质感，放在透明亚克力展示盒里，背景是柔和的棚拍打光和淡淡的品牌色渐变。

[clay]
name   = 黏土定格
prompt = 转成定格动画黏土风：所有物体都像手捏的橡皮泥，能看到指纹和捏塑痕迹，表面哑光、边缘微微不规则，暖色小灯打光，像小型摄影棚里的定格动画场景。

[lego]
name   = 乐高积木
prompt = 把整个画面重建成乐高积木世界：所有形体都由塑料颗粒拼接而成，带顶部凸点和拼接缝，颜色鲜艳干净，塑料反光明显，像一套精致的乐高套装摆拍。

[pixel]
name   = 像素游戏
prompt = 转成 16 位复古像素游戏画面：低分辨率马赛克色块、有限调色板、明显的锯齿边缘和抖动渐变，像一款 90 年代掌机 RPG 的过场立绘。

[cyberpunk]
name   = 赛博霓虹
prompt = 转成赛博朋克夜景：湿漉漉的街道反射着青紫与品红的霓虹灯光，空气里有雾和体积光，高对比、深黑阴影，点缀全息广告与故障感光晕。

[ghibli]
name   = 治愈手绘
prompt = 转成日式治愈系动画背景：柔和的水彩笔触、饱满通透的天空、蓬松的积云、温暖的午后阳光，草木细腻，整体干净明亮、充满宁静的生活气息。

[ink_wash]
name   = 水墨留白
prompt = 转成中国传统水墨画：以浓淡墨色晕染，讲究留白与虚实，宣纸质感与飞白笔触明显，只在点睛处用一点淡赭或朱红，气韵悠远。

[oil_paint]
name   = 厚涂油画
prompt = 转成古典厚涂油画：可见明显的刮刀与笔触堆叠，颜料有厚度和高光，暖调伦勃朗式侧光，暗部深沉，像挂在美术馆里的一幅肖像。

[watercolor]
name   = 清透水彩
prompt = 转成清透水彩画：颜料在湿纸上自然晕开、边缘留有水痕，色彩淡雅通透，大量留白，铅笔起稿线隐约可见，轻盈而清新。

[papercut]
name   = 剪纸拼贴
prompt = 转成分层剪纸拼贴：每个元素都是一片彩色卡纸，边缘干净利落并投下柔和阴影，层层叠出纵深感，配色扁平明快，像一本立体绘本插页。

[stained_glass]
name   = 彩绘玻璃
prompt = 转成教堂彩绘玻璃：画面被黑色铅条分割成一块块半透明彩色玻璃，背后透出明亮的光，色彩浓郁饱和，边缘发光，庄严又绚丽。

[blueprint]
name   = 工程蓝图
prompt = 转成手绘工程蓝图：深蓝背景上用白色细线勾出结构与轮廓，标注尺寸线、网格和技术注记，像一张严谨的机械设计图纸。

[polaroid]
name   = 拍立得
prompt = 转成拍立得即影照片：偏暖的褪色调、轻微漏光和暗角，颗粒感明显，白色宽边相纸，像一张随手拍下、带着旧日氛围的生活快照。

[noir]
name   = 黑白电影
prompt = 转成黑色电影质感：高对比黑白影像，硬朗的明暗分割和长长的阴影，百叶窗光斑，雾气与颗粒，充满悬疑和戏剧张力。

[synthwave]
name   = 蒸汽波
prompt = 转成 80 年代蒸汽波海报：品红到青蓝的落日渐变、发光网格地平线、霓虹描边和一轮巨大的复古落日，扫描线与故障色差点缀，复古又梦幻。

[golden_hour]
name   = 黄金时刻
prompt = 转成黄金时刻电影感：低角度的暖金色阳光洒满画面，长长的柔影、逆光轮廓光和空气中漂浮的光尘，色调温暖通透，像电影里最动人的一帧。

[jp_anime]
name   = 日漫
prompt = 转成日本动漫赛璐璐风：干净利落的描边线、平涂的色块与硬边高光阴影，通透的大眼睛和柔和的腮红，头发有明显的高光块，背景带轻微景深虚化，像一帧精致的 TV 动画画面。

[kawaii_doodle]
name   = 蜡笔涂鸦
prompt = 把上传照片转化成一种可爱混乱的儿童蜡笔涂鸦插画风格。整体像是彩铅＋蜡笔＋手账贴纸＋MS Paint涂鸦的结合。使用：粗糙线条、抖动边缘、不均匀上色、纸张纹理、彩铅叠色、蜡笔颗粒感、故意幼稚但很有灵气的画风。人物变成Q版萌系二次元风格，大眼睛，夸张表情，可爱活泼。背景加入大量doodle：爱心、星星、糖果、笑脸云朵、小花、贴纸、游戏UI元素、乱涂乱画符号。颜色以：粉色、蓝色、紫色、黄色、薄荷色为主。整体氛围：可爱、混乱、梦幻、少女感、游戏宅手账风、互联网kawaii，Kawaii aesthetic 不要精致，不要高级商业插画感，不要真实渲染，不要干净线稿，保留"手绘失败感"和"乱涂鸦感"。
